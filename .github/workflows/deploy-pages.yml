name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Разделы отчёта (/categories/, /posuda/ и т.д.) — заглушки в папках,
      # они открывают index.html нужным разделом. Сайт собирается из файлов
      # репозитория без папки .github.
      - name: Собрать сайт
        run: |
          mkdir _site
          git ls-files -z | grep -zv '^\.github/' | xargs -0 cp --parents -t _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
